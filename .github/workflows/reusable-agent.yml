name: Shared Autonomous AI Engine

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/reusable-agent.yml'

permissions:
  contents: write

jobs:
  execute-shared-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required."
            exit 1
          fi

      - name: Install System Managers
        run: |
          npm install -g pnpm tsx zod @openai/agents
          pnpm install --no-frozen-lockfile || echo "No local package.json found yet"

      - name: Fetch Global Agent Runtime
        run: |
          mkdir -p context-firewall
          curl -fsSL https://raw.githubusercontent.com/hawk7227/global-ai-pipeline/main/cloud-agent.ts -o cloud-agent.ts
          curl -fsSL https://raw.githubusercontent.com/hawk7227/global-ai-pipeline/main/context-firewall/context-firewall.js -o context-firewall/context-firewall.js
          curl -fsSL https://raw.githubusercontent.com/hawk7227/global-ai-pipeline/main/context-firewall/activate.js -o context-firewall/activate.js

      - name: Execute Live Agent Router
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --import=./context-firewall/activate.js
        run: npx tsx cloud-agent.ts

      - name: Commit and Push AI Remediations
        if: always()
        run: |
          git config --global user.name "AI-Router-Agent"
          git config --global user.email "agent@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(ai): universal self-healing patch remediation"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "Pipeline perfectly clean. No anomalies detected."
          fi
